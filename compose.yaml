services:
  time-server:
    build:
      context: ./servers/time
    ports:
      - "8901:8000"

  weather-server:
    build:
      context: ./servers/weather
    ports:
      - "8902:8000"

  filesystem-server:
    build:
      context: ./servers/filesystem
    user: "0"
    ports:
      - "8903:8000"
    environment:
      - ALLOWED_DIRECTORIES=/Users/andy
    volumes:
      - type: bind
        source: /Users/andy
        target: /Users/andy
        read_only: true

  git-server:
    build:
      context: ./servers/git
    ports:
      - "8904:8000"
    volumes:
      - type: bind
        source: /Users/andy/openapi-servers
        target: /Users/andy/openapi-servers
        read_only: true

  memory-server:
    build:
      context: ./servers/memory
    ports:
      - "8905:8000"
    volumes:
      - memory:/app/data

  # UI / extra
  quotes-ui:
    build:
      context: ./servers/quotes-ui
    ports:
      - "8906:8000"

  flashcards:
    build:
      context: ./servers/flashcards
    ports:
      - "8907:8000"

  time-ui:
    build:
      context: ./servers/time-ui
    ports:
      - "8908:8000"

  # LLM / logic
  summarizer-server:
    build:
      context: ./servers/summarizer-tool
    ports:
      - "8909:8000"
    environment:
      - MODEL_URL=http://host.docker.internal:11434
      - MODEL=qwen2.5:1.5b

  bitcoin-predictor:
    build:
      context: ./servers/bitcoin-price-predictor
    ports:
      - "8910:8000"

  sql-server:
    build:
      context: ./servers/sql
    ports:
      - "8911:8000"
    env_file:
      - /Users/andy/.config/hyperai/credentials.env
    environment:
      - DATABASE_URL=sqlite:////app/data/apo_runtime.db
      - OPENAI_API_BASE=http://host.docker.internal:9011/v1
    volumes:
      - sql-data:/app/data

  # external-rag: deferred — sentence-transformers/torch image >3 GB on this disk
  # external-rag:
  #   build:
  #     context: ./servers/external-rag
  #   ports:
  #     - "8912:8000"
  #   environment:
  #     - HF_HOME=/app/.cache
  #     - SENTENCE_TRANSFORMERS_HOME=/app/.cache
  #   volumes:
  #     - rag-cache:/app/.cache

  slack-server:
    build:
      context: ./servers/slack
    ports:
      - "8913:8000"

  google-pse:
    build:
      context: ./servers/google-pse
    ports:
      - "8914:8000"

volumes:
  memory:
  sql-data:
  rag-cache:
